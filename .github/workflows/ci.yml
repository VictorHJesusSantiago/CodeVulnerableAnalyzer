name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

permissions:
  contents: read
  security-events: write

jobs:
  quality:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install (with dev extras)
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
          pip install pip-audit

      - name: Ruff (lint)
        run: ruff check analyzer main.py

      - name: Ruff (format check)
        run: ruff format --check analyzer main.py tests

      - name: Mypy (gradual — informativo)
        run: mypy analyzer || true

      - name: Pytest (+ coverage)
        run: pytest --cov=analyzer --cov-report=term-missing --cov-fail-under=75

      - name: Python dependency audit
        run: pip-audit --requirement requirements.txt

  dotnet:
    name: .NET identity collector
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Restore
        run: dotnet restore analyzer/identity_dotnet/VulnScan.Identity.csproj --source https://api.nuget.org/v3/index.json

      - name: Build
        run: dotnet build analyzer/identity_dotnet/VulnScan.Identity.csproj --configuration Release --no-restore

      - name: Check vulnerable packages
        run: dotnet list analyzer/identity_dotnet/VulnScan.Identity.csproj package --vulnerable --include-transitive --no-restore --source https://api.nuget.org/v3/index.json

  codeql:
    name: CodeQL security scan
    runs-on: ubuntu-latest
    needs:
      - quality
      - dotnet

    steps:
      - uses: actions/checkout@v4

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v3
        with:
          languages: python,csharp,javascript-typescript

      - name: Autobuild
        uses: github/codeql-action/autobuild@v3

      - name: Analyze
        uses: github/codeql-action/analyze@v3

  dependency-review:
    name: Dependency review
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    permissions:
      contents: read
      pull-requests: read

    steps:
      - uses: actions/checkout@v4

      - name: Review dependency changes
        uses: actions/dependency-review-action@v4
