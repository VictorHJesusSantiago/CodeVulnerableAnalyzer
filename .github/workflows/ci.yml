name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  quality:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install (with dev extras)
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Ruff (lint)
        run: ruff check analyzer main.py

      - name: Ruff (format check)
        run: ruff format --check analyzer main.py tests

      - name: Mypy (gradual — informativo)
        run: mypy analyzer || true

      - name: Pytest (+ coverage)
        run: pytest --cov=analyzer --cov-report=term-missing --cov-fail-under=75
