[build-system]
requires = ["setuptools>=70", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "code-vulnerable-analyzer"
version = "2.0.0"
description = "Analisador estático multi-linguagem, IaC, segredos e compliance"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [{name = "CodeVulnerableAnalyzer"}]
dependencies = ["rich>=13.7.0,<14.0.0"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Environment :: Console",
  "Topic :: Security",
  "Programming Language :: Python :: 3",
]

[project.scripts]
vulnscan = "main:main"

[tool.setuptools]
py-modules = ["main"]

[tool.setuptools.packages.find]
include = ["analyzer*"]

[project.optional-dependencies]
# Ferramentas de qualidade — instale com: pip install -e ".[dev]"
dev = [
  "ruff>=0.6",
  "mypy>=1.11",
  "pytest>=8",
  "pytest-cov>=5",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

# ── Lint (ruff) ───────────────────────────────────────────────────────────────
[tool.ruff]
line-length = 120
target-version = "py310"

[tool.ruff.lint]
# Gate ENFORÇADO (bloqueante no CI). O codebase passa 100% neste conjunto:
#   F  (pyflakes)  — bugs reais: nomes indefinidos, imports não usados,
#                    chaves de dict duplicadas, f-strings vazias, redefinições
#   I  (isort)     — ordenação de imports
#   UP (pyupgrade) — sintaxe moderna (list/dict, X | None, etc.)
#   E/W            — estilo pycodestyle
#   B  (bugbear)   — armadilhas comuns (zip sem strict=, raise sem from, etc.)
select = ["F", "I", "UP", "E", "W", "B"]
# Código já normalizado por `ruff format` (E701/E702 eliminados). Só E501
# (linha longa) fica fora: as tabelas de regras alinham colunas de propósito.
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
# Tabelas de regras alinham colunas propositalmente (linhas longas).
"analyzer/rules/*.py" = ["E501"]
"tests/*.py" = ["E501"]

# ── Tipagem (mypy — gradual) ──────────────────────────────────────────────────
[tool.mypy]
python_version = "3.10"
ignore_missing_imports = true
warn_unused_ignores = true
warn_redundant_casts = true
# Gradual: começa permissivo num codebase grande e amplamente não-tipado;
# aperte estes flags (check_untyped_defs, disallow_untyped_defs) com o tempo.
check_untyped_defs = false
exclude = "(^build/|^tests/)"

# ── Cobertura ─────────────────────────────────────────────────────────────────
[tool.coverage.run]
source = ["analyzer"]
omit = ["*/tests/*", "*/build/*"]

[tool.coverage.report]
show_missing = true
# Piso de cobertura (ratchet): fixado logo abaixo da cobertura atual (~75%)
# para impedir REGRESSÃO. Suba este número conforme a cobertura cresce —
# nunca o abaixe.
fail_under = 75
